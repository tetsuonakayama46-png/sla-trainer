<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f1a">
<title>SLA Trainer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* 1画面・1タップのトレーナー。ダーク固定（没入のため） */
  :root {
    --bg:#0b0f1a; --panel:#131a2a; --line:#243049; --fg:#eef2f8; --muted:#8b97b1;
    --accent:#6c7cff; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --native:#60a5fa;
    --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{height:100%;display:flex;flex-direction:column;touch-action:manipulation}
  .gauge{height:5px;background:var(--line)} .gauge>i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
  .hdr{display:flex;justify-content:space-between;padding:8px max(16px,env(safe-area-inset-left)) 6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hdr .combo{color:var(--warn);font-weight:700}
  .scene{position:relative;aspect-ratio:16/9;max-height:30dvh;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .scene .tap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:var(--fg);gap:6px}
  .scene .tap b{font-size:40px;line-height:1}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px max(16px,env(safe-area-inset-left));gap:14px}
  .text{font-size:clamp(22px,6.5vw,32px);font-weight:700;line-height:1.3;text-align:center;letter-spacing:-.01em;text-wrap:balance}
  .text span{display:inline-block;margin:0 .18em;transition:color .3s}
  .text .g{color:var(--good)} .text .y{color:var(--warn)} .text .r{color:var(--bad)}
  .status{text-align:center;font-size:14px;color:var(--muted);min-height:20px}
  .status.rec{color:var(--good);font-weight:600;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .wave{padding:0 max(16px,env(safe-area-inset-left)) max(20px,env(safe-area-inset-bottom))}
  .wave .lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
  .wave .lbl b{color:var(--native)} .wave .lbl i{color:var(--good);font-style:normal}
  canvas{width:100%;height:110px;display:block;background:rgba(0,0,0,.35);border-radius:10px}
  .overlay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.5);pointer-events:none}
  .overlay.flash{background:rgba(74,222,128,.22)}
  .overlay .n{font-size:min(36vw,150px);font-weight:900;line-height:1;text-shadow:0 0 30px rgba(0,0,0,.7);animation:pop .3s ease-out}
  .overlay .sub{margin-top:8px;display:flex;gap:14px;font-size:13px;color:#cbd5e1}
  .overlay .combo{margin-top:14px;font-size:30px;font-weight:800;color:var(--warn);animation:pop .3s ease-out}
  .overlay .stage{margin-top:8px;padding:4px 12px;border-radius:999px;background:var(--accent);font-size:13px;font-weight:600}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
  .center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px max(16px,env(safe-area-inset-left));gap:10px}
  .center h1{font-size:22px;margin:0} .center p{color:var(--muted);font-size:14px;max-width:320px;margin:0;line-height:1.6}
  .btn{margin-top:14px;padding:16px 32px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;font-family:inherit}
  .btn:active{transform:scale(.96)} .btn.ghost{background:var(--panel);color:var(--fg);font-size:15px;padding:12px 22px}
  .big{font-size:64px;font-weight:900;color:var(--good)}
  .err{color:var(--bad);font-weight:600}
  .jp{font-size:clamp(16px,4.5vw,20px);color:var(--muted);text-align:center;line-height:1.5}
  .jp.big{font-size:clamp(22px,6vw,28px);color:var(--fg);font-weight:700}
  .sit{font-size:12px;color:var(--native);text-align:center;letter-spacing:.06em}
  .stepbar{display:flex;gap:4px;justify-content:center;margin-top:2px} .stepbar i{width:18px;height:4px;border-radius:2px;background:var(--line)} .stepbar i.on{background:var(--accent)}
  .menu{height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px max(16px,env(safe-area-inset-left));gap:12px}
  .menu .wk{font-size:12px;color:var(--native);letter-spacing:.1em;text-transform:uppercase} .menu h1{font-size:24px;margin:0;line-height:1.3}
  .menu .goal{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
  .menu .plan{display:flex;gap:10px;margin-top:6px} .menu .plan div{flex:1;background:var(--panel);border-radius:12px;padding:12px;text-align:center} .menu .plan b{display:block;font-size:26px} .menu .plan span{font-size:11px;color:var(--muted)}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden} .bar i{display:block;height:100%;background:var(--good)}
  .small{font-size:12px;color:var(--muted);text-align:center}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="curriculum.js?v=2026.11.15.2"></script>
<script>
const APP_VERSION = "2026.11.15.2";
// 自動更新: 古いキャッシュ（ホーム画面アプリ等）を検知したら、クエリを変えて読み直す
(async()=>{ try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); const j=await r.json();
  if (j.version && j.version!==APP_VERSION && !location.search.includes("v="+j.version)) location.replace(location.pathname+"?v="+j.version); }catch{} })();
// ==================== カリキュラム → 学習項目 ====================
const CUR = window.CURRICULUM;
const STEPS = CUR.steps;                       // 1..5
const SESSION_SEC = 300, SILENCE_MS = 700, VAD_TH = 0.02;
const NEW_PER_DAY = 4, REVIEW_PER_DAY = 4, WEEK_GATE = 0.7;
// 単語長から参照タイミング（秒）を合成。rate で伸縮。
function timings(en, rate){ const ws=en.split(/\s+/); let t=0; return ws.map(w=>{ const d=(0.10+0.055*w.replace(/[^A-Za-z']/g,"").length)/rate; const a=t; t+=d; return [w,a,t]; }); }
const ITEMS = []; const BYID = {};
for (const w of CUR.weeks) for (const it of w.items){ const o={...it, week:w.week, phase:w.phase}; ITEMS.push(o); BYID[o.id]=o; }

// ==================== 永続化（この端末のみ） ====================
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v==null? d : JSON.parse(v);} catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let progress = store.get("cur_progress", {});   // id -> {step, pass, fail, n, last, best}
let streak = store.get("streak", {days:0, last:null});
let startDate = store.get("cur_start", null);
function prog(id){ return progress[id] ??= {step:1, pass:0, fail:0, n:0, last:0, best:0}; }
function stepOf(id){ return STEPS[Math.min(5,Math.max(1,prog(id).step))-1]; }

// ==================== 週の判定（日数＋前週の達成率でゲート） ====================
function weekDone(week){ const its=ITEMS.filter(i=>i.week===week); if(!its.length) return true; return its.filter(i=>prog(i.id).step>=3).length/its.length >= WEEK_GATE; }
function currentWeek(){
  const days = startDate ? Math.floor((Date.now()-startDate)/864e5) : 0;
  const byDays = Math.min(12, Math.floor(days/7)+1);
  let w=1; while (w<byDays && weekDone(w)) w++;     // 前週が70%未満なら進まない（復習週）
  return w;
}
function planToday(week){
  const now=Date.now(), DAY=864e5;
  // 復習: 途中の文（古い順）＋ 到達済みでも3日以上触っていない文（維持）
  const started = ITEMS.filter(i=>prog(i.id).n>0 && (prog(i.id).step<5 || now-prog(i.id).last>3*DAY)).sort((a,b)=>prog(a.id).last-prog(b.id).last);
  const fresh = ITEMS.filter(i=>i.week<=week && prog(i.id).n===0).sort((a,b)=>a.week-b.week);
  let news = fresh.slice(0, NEW_PER_DAY);
  let review = started.slice(0, REVIEW_PER_DAY + (NEW_PER_DAY-news.length));
  // 新しい文は1セッションで2回出す（合格2回で次ステップ）。同じ文が連続しないよう交互に並べる
  let list=[]; const a=[...news, ...review], b=[...news];
  while (a.length||b.length){ if(a.length) list.push(a.shift()); if(b.length){ const x=b.shift(); if(list.at(-1)===x) b.push(x); else list.push(x); } }
  if (!list.length){ list = ITEMS.filter(i=>i.week<=week).sort(()=>Math.random()-.5).slice(0,8); }
  return { list, review:review.length, news:news.length };
}
function overallProgress(){ const done=ITEMS.filter(i=>prog(i.id).step>=5).length, mid=ITEMS.filter(i=>prog(i.id).step>=3).length; return {done, mid, total:ITEMS.length}; }

// ==================== 採点（デモ: 発話長と音量から。音声認識なし） ====================
function hash(arr){ let h=2166136261; for (let i=0;i<Math.min(arr.length,4000);i++){ h^=(arr[i]*1e4)|0; h=Math.imul(h,16777619);} return h>>>0; }
function scoreDemo(samples, sr, t){
  const dur = samples.length/sr;
  let s=0; for (const v of samples) s+=v*v; const rms = Math.sqrt(s/Math.max(1,samples.length));
  const refDur = t.at(-1)[2]-t[0][1];
  let base;
  if (dur<0.3 || rms<0.005) base = 20;
  else { const ratio = Math.min(dur, refDur*2.5)/refDur; base = 92 - Math.min(40, Math.abs(ratio-1.1)*45) - (rms>0.02?0:15); }
  base = Math.max(10, Math.min(98, base));
  const h = hash(samples);
  const words = t.map((w,i)=>{ const j=((h>>(i*3))%23)-11; return {word:w[0], acc:Math.max(0,Math.min(100,base+j))}; });
  const wa = words.reduce((a,w)=>a+w.acc,0)/words.length;
  const timing = Math.min(400, Math.abs(dur-refDur)/Math.max(refDur,.1)*150);
  const prosody = Math.max(30, Math.min(95, base+3));
  const overall = 0.6*wa + 0.25*prosody + 0.15*(100-Math.min(timing,300)/3);
  return {overall:Math.round(overall), wa, prosody:Math.round(prosody), timing:Math.round(timing), words};
}
// 5ステップ判定: 合格2連続で次のステップ、不合格2連続で1つ戻る
function stepUpdate(p, overall, reactionMs){
  const st = STEPS[p.step-1]; const before=p.step;
  let ok = overall >= st.pass;
  if (p.step===5 && reactionMs!=null && reactionMs>3000) ok=false;   // 状況即答は3秒以内
  p.n++; p.last=Date.now(); p.best=Math.max(p.best, overall);
  if (ok){ p.pass++; p.fail=0; if (p.pass>=2 && p.step<5){ p.step++; p.pass=0; } }
  else { p.fail++; p.pass=0; if (p.fail>=2 && p.step>1){ p.step--; p.fail=0; } }
  return {before, after:p.step, ok};
}

// ==================== 音 ====================
let actx=null, stream=null;
function tone(f, d=0.15){ try{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.setValueAtTime(.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch{} }
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>/en[-_]US/i.test(v.lang)&&/natural|neural|premium|enhanced|samantha|aria|zira|google us/i.test(v.name))
      || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
function speak(text, rate=1){ return new Promise(res=>{
  const u = new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate; const v=pickVoice(); if(v) u.voice=v;
  let done=false; const fin=()=>{ if(!done){done=true;res();} };
  u.onend=fin; u.onerror=fin; speechSynthesis.cancel(); speechSynthesis.speak(u);
  setTimeout(fin, 1500 + text.length*90/rate);
});}

// ==================== 状態 ====================
const S = { phase:"init", idx:0, list:[], week:1, plan:null, combo:0, comboMax:0, remain:SESSION_SEC, result:null, detail:null, refWave:[], userWave:[], level:0, err:"", t:null, reveal:false };
let timer=null, vadTimer=null, waveTimer=null, proc=null, src=null, t0=0, speechStart=null;
const cur = ()=>S.list[S.idx];

function el(h){ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; }
const app = document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  if (S.phase==="init"){ app.replaceChildren(el(`<div class="center"><p>準備中…</p></div>`)); return; }
  if (S.phase==="permission"){
    app.replaceChildren(el(`<div class="center">
      <div style="font-size:48px">🎙️</div><h1>マイクと音声を有効にする</h1>
      <p>初回のみ必要です。次回からは開くだけで学習が始まります。イヤホン推奨。</p><p class="small">3か月カリキュラム版 v${APP_VERSION}</p>
      <button class="btn" id="perm">有効にする</button>${S.err?`<p class="err">${esc(S.err)}</p>`:""}</div>`));
    document.getElementById("perm").onclick = requestPermission; return;
  }
  if (S.phase==="menu"){
    const wk = CUR.weeks.find(w=>w.week===S.week), ph = CUR.phases[wk.phase], op=overallProgress();
    const pct = Math.round(op.mid/op.total*100);
    app.replaceChildren(el(`<div class="menu">
      <div class="wk">Week ${S.week} / 12 ・ フェーズ${ph.id} ${esc(ph.name)}</div>
      <h1>${esc(wk.title)}</h1>
      <p class="goal">${esc(ph.goal)}</p>
      <div class="plan"><div><b>${S.plan.news}</b><span>新しい文</span></div><div><b>${S.plan.review}</b><span>復習</span></div><div><b>${streak.days}</b><span>連続日</span></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="small">全${op.total}文中 ${op.mid}文が「ひとりで」以上（${pct}%）・${op.done}文が「状況で即答」到達</div>
      <button class="btn" id="go">はじめる（約5分）</button>
      <div class="small">ステップ: 意味＋ゆっくり → いっしょに → ひとりで → 見ないで → 状況で即答</div>
      <div class="small">v${APP_VERSION}</div>
    </div>`));
    document.getElementById("go").onclick = ()=>{ S.phase="ready"; render(); app.onpointerdown=onFirstTap; }; return;
  }
  if (S.phase==="finished"){
    const op=overallProgress();
    app.replaceChildren(el(`<div class="center"><div class="big">DONE</div>
      <p>最大コンボ ${S.comboMax} ・ 連続 ${streak.days} 日目<br>「ひとりで」以上: ${op.mid}/${op.total}文</p>
      <button class="btn ghost" id="again">もう1セット</button></div>`));
    document.getElementById("again").onclick = ()=>{ startSession(); }; return;
  }
  if (S.phase==="error"){
    app.replaceChildren(el(`<div class="center"><p class="err">${esc(S.err)}</p><button class="btn ghost" id="re">再読み込み</button></div>`));
    document.getElementById("re").onclick=()=>location.reload(); return;
  }
  const ch = cur(), st = stepOf(ch.id);
  const label = {ready:"画面をタップして開始", playing:"聞いて…", recording: st.n===5?"状況を見て、英語で！":"話して！", scoring:"採点中…", result:""}[S.phase] ?? "";
  const showEn = st.showEn || S.reveal;
  const words = ch.en.split(/\s+/).map((w,i)=>{
    let cls=""; if (S.detail){ const a=S.detail[i]?.acc ?? 100; cls = a>=80?"g":a>=60?"y":"r"; }
    return `<span class="${cls}">${esc(w)}</span>`; }).join("");
  const enHtml = showEn ? `<p class="text">${words}</p>` : `<p class="text" style="color:var(--line)">${ch.en.split(/\s+/).map(w=>"•".repeat(Math.max(2,w.length))).join(" ")}</p>`;
  const jpHtml = st.n===5 && !S.reveal ? `<p class="sit">状況</p><p class="jp big">${esc(ch.sit)}</p>` : (st.showJp || S.reveal) ? `<p class="jp ${st.n<=2?"big":""}">${esc(ch.jp)}</p>` : "";
  const stepbar = `<div class="stepbar">${STEPS.map(s=>`<i class="${s.n<=st.n?"on":""}"></i>`).join("")}</div>`;
  app.replaceChildren(el(`<div style="display:contents">
    <div class="gauge"><i style="width:${S.remain/SESSION_SEC*100}%"></i></div>
    <div class="hdr"><span>${S.idx+1} / ${S.list.length}</span><span>Step ${st.n} ${esc(st.name)}</span><span class="combo">${S.combo>0?S.combo+"x":""}</span></div>
    <div class="scene">${S.phase==="ready"?`<div class="tap"><b>▶</b><span>${label}</span></div>`:`<div class="sit" style="padding:0 16px">${esc(st.hint)}</div>`}</div>
    <div class="body">${st.n===5&&!S.reveal?jpHtml+enHtml:enHtml+jpHtml}${stepbar}<div class="status ${S.phase==="recording"?"rec":""}">${label}</div></div>
    <div class="wave"><div class="lbl"><b>Native</b><i>You</i></div><canvas id="cv"></canvas></div>
    ${S.phase==="result"&&S.result?overlayHtml():""}
  </div>`));
  drawWave();
}
function overlayHtml(){
  const r=S.result, c = r.ok?"var(--good)":"var(--bad)";
  return `<div class="overlay ${r.ok?"flash":""}"><div class="n" style="color:${c}">${r.overall}</div>
    <div class="sub"><span>${r.ok?"合格":"もう一回"}</span><span>Timing ±${r.timing}ms</span>${r.reaction!=null?`<span>反応 ${(r.reaction/1000).toFixed(1)}s</span>`:""}<span style="color:var(--warn)">デモ採点</span></div>
    ${S.combo>=2?`<div class="combo">${S.combo} COMBO!</div>`:""}
    ${r.stepAfter>r.stepBefore?`<div class="stage">Step ${r.stepBefore} → ${r.stepAfter} ${esc(STEPS[r.stepAfter-1].name)}</div>`:r.stepAfter<r.stepBefore?`<div class="stage" style="background:var(--bad)">Step ${r.stepBefore} → ${r.stepAfter} に戻ってやり直し</div>`:""}</div>`;
}
function drawWave(){
  const cv=document.getElementById("cv"); if(!cv) return;
  const dpr=devicePixelRatio||1, w=cv.clientWidth, h=110; cv.width=w*dpr; cv.height=h*dpr;
  const g=cv.getContext("2d"); g.scale(dpr,dpr); g.clearRect(0,0,w,h);
  const n=Math.max(S.refWave.length,S.userWave.length,1), bw=w/n, mid=h/2;
  const norm=a=>{const m=Math.max(...a,.0001);return a.map(v=>v/m);};
  g.strokeStyle="rgba(148,163,184,.4)"; g.beginPath(); g.moveTo(0,mid); g.lineTo(w,mid); g.stroke();
  g.fillStyle="rgba(96,165,250,.85)"; norm(S.refWave).forEach((v,i)=>{const hh=v*(mid-4); g.fillRect(i*bw,mid-hh,Math.max(1,bw-1),hh);});
  g.fillStyle="rgba(74,222,128,.9)";  norm(S.userWave).forEach((v,i)=>{const hh=v*(mid-4); g.fillRect(i*bw,mid,Math.max(1,bw-1),hh);});
  if (S.phase==="recording"){ g.fillStyle="rgba(250,204,21,.9)"; g.fillRect(w-6,mid,6,Math.min(1,S.level*6)*(mid-4)); }
}

// ==================== フロー ====================
async function requestPermission(){
  try{
    const AC = window.AudioContext||window.webkitAudioContext; actx = new AC(); await actx.resume();
    stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    store.set("mic",1); speechSynthesis.getVoices();
    startSession();
  }catch(e){ S.err="マイクの許可が必要です: "+e.message; render(); }
}
function startSession(){
  if (!startDate){ startDate=Date.now(); store.set("cur_start", startDate); }
  S.week = currentWeek(); S.plan = planToday(S.week); S.list = S.plan.list;
  S.idx=0; S.combo=0; S.comboMax=0; S.remain=SESSION_SEC; S.detail=null; S.result=null; S.userWave=[]; S.reveal=false;
  const today = new Date().toISOString().slice(0,10);
  if (streak.last!==today){ const y=new Date(Date.now()-864e5).toISOString().slice(0,10); streak={days: streak.last===y? streak.days+1 : 1, last:today}; store.set("streak",streak); }
  S.phase="menu"; render();
}
async function onFirstTap(){
  if (S.phase!=="ready") return; app.onpointerdown=null;
  try{
    const AC = window.AudioContext||window.webkitAudioContext; actx ??= new AC(); await actx.resume();
    stream ??= await navigator.mediaDevices.getUserMedia({audio:true});
    tone(523,.08);
    clearInterval(timer); timer=setInterval(()=>{ S.remain--; if(S.remain<=0){ finishSession(); } else { const g=document.querySelector(".gauge>i"); if(g) g.style.width=S.remain/SESSION_SEC*100+"%"; } },1000);
    await startItem();
  }catch(e){ S.phase="error"; S.err="初期化に失敗: "+e.message; render(); }
}
async function startItem(){
  const ch = cur(), st = stepOf(ch.id);
  S.t = timings(ch.en, st.rate); S.result=null; S.detail=null; S.userWave=[]; S.reveal=false;
  const end=S.t.at(-1)[2]; S.refWave = Array.from({length:Math.ceil(end/.05)},(_,i)=>{const t=i*.05; return S.t.some(w=>t>=w[1]&&t<w[2]) ? .5+.4*Math.abs(Math.sin(i*1.7)) : .05;});
  if (st.playFirst){ S.phase="playing"; render(); await speak(ch.en, st.rate); }
  else { S.phase="recording"; render(); tone(660,.06); }   // Step5: 状況だけ見て即答
  startRecording();
}
function startRecording(){
  t0=performance.now(); speechStart=null; S.userWave=[]; S.phase="recording"; render();
  const chunksArr=[]; src=actx.createMediaStreamSource(stream); proc=actx.createScriptProcessor(4096,1,1);
  proc.onaudioprocess=e=>chunksArr.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(actx.destination);
  const an=actx.createAnalyser(); an.fftSize=1024; src.connect(an); const buf=new Float32Array(an.fftSize);
  const refMs=(S.t.at(-1)[2]-S.t[0][1])*1000, maxMs=Math.min(15000, refMs*2.5+ (stepOf(cur().id).n===5?4000:2000));
  let speaking=false, lastVoice=0, ended=false;
  // 電車内などの騒音対策: 録音開始から300msの環境音RMSを測り、閾値を環境音の2.5倍（下限 VAD_TH）に自動調整
  let th=VAD_TH, calN=0, calSum=0; const CAL_MS=300;
  const finish=()=>{ if(ended) return; ended=true; clearInterval(vadTimer); clearInterval(waveTimer);
    try{proc.disconnect(); src.disconnect(); an.disconnect();}catch{}
    const total=chunksArr.reduce((a,c)=>a+c.length,0), merged=new Float32Array(total); let o=0; for(const c of chunksArr){merged.set(c,o);o+=c.length;}
    onRecorded(merged, actx.sampleRate); };
  vadTimer=setInterval(()=>{ an.getFloatTimeDomainData(buf); let s=0; for(const v of buf) s+=v*v; const rms=Math.sqrt(s/buf.length); S.level=rms; const now=performance.now();
    if (now-t0<CAL_MS){ calN++; calSum+=rms; return; }
    if (calN && th===VAD_TH){ th=Math.max(VAD_TH, (calSum/calN)*2.5); calN=0; }
    if (rms>=th){ if(!speaking){speaking=true; speechStart=now;} lastVoice=now; }
    else if (speaking && now-lastVoice>=SILENCE_MS){ finish(); return; }
    if (now-t0>=maxMs) finish(); },20);
  waveTimer=setInterval(()=>{ S.userWave.push(S.level); drawWave(); },50);
}
async function onRecorded(samples, sr){
  const ch = cur(), st = stepOf(ch.id);
  S.phase="scoring"; render();
  const r = scoreDemo(samples, sr, S.t);
  r.reaction = speechStart? Math.round(speechStart-t0) : null;
  const u = stepUpdate(prog(ch.id), r.overall, r.reaction); store.set("cur_progress",progress);
  r.stepBefore=u.before; r.stepAfter=u.after; r.ok=u.ok;
  S.result=r; S.detail=r.words; S.reveal=true;                 // 結果では必ず英文と意味を見せる
  S.combo = u.ok ? S.combo+1 : 0; S.comboMax=Math.max(S.comboMax,S.combo);
  tone(r.overall>=90?880:u.ok?660:330, u.ok?.15:.08);
  S.phase="result"; render();
  if (st.n>=4 || !u.ok){ await speak(ch.en, 1.0); }           // 見ないで／状況即答／不合格時はお手本をもう一度
  setTimeout(next, st.n>=4||!u.ok ? 400 : 1000);
}
async function next(){
  if (S.idx+1>=S.list.length){ finishSession(); return; }
  S.idx++; await startItem();
}
function finishSession(){ clearInterval(timer); clearInterval(vadTimer); clearInterval(waveTimer); speechSynthesis.cancel(); S.phase="finished"; render(); }

// ==================== 起動 ====================
(function boot(){
  if (!navigator.mediaDevices?.getUserMedia){ S.phase="error"; S.err="このブラウザはマイクに対応していません。Safari または Chrome で https のURLから開いてください。"; render(); return; }
  if (!window.CURRICULUM){ S.phase="error"; S.err="curriculum.js が読み込めませんでした。"; render(); return; }
  S.phase="permission"; render();
  speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices();
})();
</script>
